name: Benchmark (exploratory, not release qualification)
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev heaptrack
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake compile
      - run: ruby tools/build_baseline.rb "$RUNNER_TEMP/rinku-c"
      - run: ruby tools/differential.rb "$RUNNER_TEMP/rinku-c/lib:$RUNNER_TEMP/rinku-c/ext/rinku"
      - run: ruby tools/benchmark.rb "$RUNNER_TEMP/rinku-c/lib:$RUNNER_TEMP/rinku-c/ext/rinku" tmp/measurements --report-only
      - name: Native allocations (separate from timings)
        run: |
          RINKU_LIB="$RUNNER_TEMP/rinku-c/lib:$RUNNER_TEMP/rinku-c/ext/rinku" heaptrack -o tmp/measurements/c-memory ruby tools/memory_worker.rb
          RINKU_LIB="$PWD/lib" heaptrack -o tmp/measurements/rust-memory ruby tools/memory_worker.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-samples-and-metadata
          path: tmp/measurements
