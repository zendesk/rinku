name: Publish to RubyGems.org

on:
  workflow_dispatch:
    inputs:
      qualification_evidence:
        description: 'HTTPS URL for reviewed, controlled performance and native-memory evidence'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems-publish
    if: github.repository_owner == 'zendesk'
    permissions:
      id-token: write
      contents: write
    env:
      QUALIFICATION_EVIDENCE: ${{ inputs.qualification_evidence }}
    steps:
      - uses: actions/checkout@v7
      - name: Require release qualification evidence
        run: ruby -ruri -e 'u = URI.parse(ENV.fetch("QUALIFICATION_EVIDENCE")); abort "HTTPS evidence URL required" unless u.scheme == "https" && u.host'
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install dependencies
        run: bundle install
      - name: Validate prerelease package
        run: |
          bundle exec rake test gc_stress
          cargo test -p rinku-core --locked
          ruby tools/package_smoke.rb
      - uses: rubygems/release-gem@v1
