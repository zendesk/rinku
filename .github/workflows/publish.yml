name: Publish to RubyGems.org

on:
  workflow_dispatch:
    inputs:
      qualification_evidence:
        description: 'HTTPS URL for reviewed, controlled performance and native-memory evidence'
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang for rb-sys bindgen
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate and build source gem
        run: |
          bundle exec rake test gc_stress
          cargo test -p rinku-core --locked
          ruby tools/package_smoke.rb
          bundle exec rake build

      - uses: actions/upload-artifact@v7
        with:
          name: source-gem
          path: pkg/*.gem
          if-no-files-found: error

  cross-gem:
    name: Build native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - aarch64-linux
          - arm64-darwin
          - x86_64-linux
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install dependencies
        run: bundle install

      - name: Build native gem
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RB_SYS_DOCK_CACHE_DIR: ${{ runner.temp }}/rb-sys-dock
        run: |
          # rb-sys-dock 0.9.130 creates ./registry instead of its bind-mount source.
          export CARGO_HOME="$RB_SYS_DOCK_CACHE_DIR/cargo"
          mkdir -p "$CARGO_HOME/registry"
          bundle exec rb-sys-dock \
            --platform "$PLATFORM" \
            --directory . \
            --ruby-versions "3.3,3.4,4.0" \
            --build

      - uses: actions/upload-artifact@v7
        with:
          name: cross-gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem
          if-no-files-found: error

  publish:
    name: Publish gems to RubyGems.org
    runs-on: ubuntu-latest
    needs: [source-gem, cross-gem]
    environment: rubygems-publish
    if: github.repository_owner == 'zendesk'
    permissions:
      id-token: write
      contents: write
    env:
      QUALIFICATION_EVIDENCE: ${{ inputs.qualification_evidence }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require release qualification evidence
        run: ruby -ruri -e 'u = URI.parse(ENV.fetch("QUALIFICATION_EVIDENCE")); abort "HTTPS evidence URL required" unless u.scheme == "https" && u.host'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Create and push release tag
        run: |
          tag=$(ruby -r ./lib/version -e 'puts "v#{Rinku::VERSION}"')
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists on a different commit"
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$tag"

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish gems to RubyGems.org
        run: |
          set -euo pipefail
          shopt -s nullglob
          gems=(pkg/*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "::error::No gem artifacts were downloaded"
            exit 1
          fi
          for gem in "${gems[@]}"; do
            gem push "$gem"
          done

      - name: Remove RubyGems credentials
        if: always()
        run: rm -f "$HOME/.gem/credentials"
